<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costia — Mis productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/base.css?v=31">
    <link rel="stylesheet" href="../assets/css/terminal-theme.css?v=31">
    <link rel="stylesheet" href="../assets/css/app-shell.css?v=31">
    <link rel="stylesheet" href="../assets/css/app.css?v=31">
    <link rel="stylesheet" href="../assets/css/productos.css?v=31">
    <link rel="icon" href="../assets/img/costia-icon-green.png">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#071F17">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="../assets/img/costia-icon-green.png">
</head>
<body class="costia-workstation-body">

<!-- ENLACE DE ACCESIBILIDAD PARA SALTAR AL CONTENIDO (WCAG AAA) -->
<a href="#contenido-principal" class="costia-skip-link">Saltar al contenido principal</a>

<!-- BARRA SUPERIOR PARA PANTALLAS MÓVILES (< 900px) -->
<header class="costia-mobile-bar" role="banner">
    <a href="dashboard.html" class="costia-mobile-brand">
        <img src="../assets/img/costia-icon-green.png" alt="Logo Costia" width="28" height="28" class="costia-mobile-brand-logo">
        <span class="costia-mobile-brand-title">Costia</span>
    </a>
    <button type="button" class="costia-mobile-toggle" id="btn-mobile-sidebar-toggle" aria-label="Abrir menú de navegación" aria-expanded="false" aria-controls="terminal-sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
</header>
<div class="costia-drawer-backdrop" id="costia-drawer-backdrop" aria-hidden="true"></div>

<!-- SHELL CONTENEDOR PRINCIPAL -->
<div class="terminal-shell-container">

    <!-- ===== SIDEBAR LATERAL UNIFICADA (hidratada por app-shell.js) ===== -->
    <aside class="terminal-sidebar" id="terminal-sidebar" aria-label="Navegación principal de Costia"></aside>

    <!-- ===== VIEWPORT DE CONTENIDO PRINCIPAL ===== -->
    <div class="terminal-content-viewport">

        <!-- ===== BARRA SUPERIOR EJECUTIVA ===== -->
        <header class="topbar-status-bar" role="region" aria-label="Barra ejecutiva de resumen">
            <div class="topbar-context-box">
                <span class="topbar-beacon-dot" aria-hidden="true"></span>
                <span class="topbar-context-title">Mis recetas y precios</span>
            </div>

            <div class="topbar-status-actions">
                <a href="dashboard.html" class="btn-secundario btn-sm topbar-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                    <span>Simular precios</span>
                </a>
            </div>
        </header>

        <!-- ===== CONTENIDO PRINCIPAL DE LA APLICACIÓN ===== -->
        <main class="terminal-main-stage" id="contenido-principal">

            <!-- ========================================================
                 CATÁLOGO DE PRODUCTOS & KPIS
                 ======================================================== -->
            <section class="seccion-catalogo-principal" aria-label="Catálogo y gestión de productos">

                <!-- Encabezado principal -->
                <div class="contenido__encabezado">
                    <div>
                        <h1 class="contenido__titulo">Mis productos</h1>
                        <p class="contenido__subtitulo">Gestiona el costo unitario, margen real y precio de venta de cada receta</p>
                    </div>
                    <div class="contenido__acciones">
                        <button type="button" class="btn-secundario" id="btn-exportar-backup" title="Exportar catálogo completo de productos en PDF con recetas y precios">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect width="12" height="8" x="6" y="14"></rect></svg>
                            <span>Exportar catálogo (PDF)</span>
                        </button>
                        <a href="crear-producto.html" class="btn-primario">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            <span>Nuevo producto</span>
                        </a>
                    </div>
                </div>

                <!-- Mini-Dashboard KPIs ultra-compacto -->
                <section class="kpis-grid" aria-label="Resumen de productos">
                    <div class="kpi-card">
                        <span class="kpi-card__icono kpi-card__icono--verde">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                        </span>
                        <div class="kpi-card__info">
                            <span class="kpi-card__etiqueta">Total:</span>
                            <strong class="kpi-card__valor tabular-nums" id="kpi-prod-total">0 activos</strong>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <span class="kpi-card__icono kpi-card__icono--pino">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
                        </span>
                        <div class="kpi-card__info">
                            <span class="kpi-card__etiqueta">Rentabilidad:</span>
                            <strong class="kpi-card__valor tabular-nums" id="kpi-prod-margen">0%</strong>
                        </div>
                    </div>
                    <div class="kpi-card" id="kpi-card-alertas">
                        <span class="kpi-card__icono kpi-card__icono--ambar" id="kpi-icono-alertas">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        </span>
                        <div class="kpi-card__info">
                            <span class="kpi-card__etiqueta">Alertas:</span>
                            <strong class="kpi-card__valor kpi-card__valor--texto" id="kpi-prod-alertas">Todo al día</strong>
                        </div>
                    </div>
                </section>

                <!-- Buscador y Filtros Rápidos requerido por Playwright -->
                <div class="barra-herramientas">
                    <div class="buscador">
                        <span class="buscador__icono" aria-hidden="true">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </span>
                        <input
                            type="search"
                            id="buscar-producto"
                            class="buscador__input"
                            placeholder="Buscar producto por nombre..."
                            aria-label="Buscar producto por nombre"
                        >
                    </div>
                    <div class="filtros-pills" role="group" aria-label="Filtrar productos">
                        <button type="button" class="filtro-pill activo" data-filtro="todos">Todos</button>
                        <button type="button" class="filtro-pill" data-filtro="alerta" id="pill-alerta">Con alerta</button>
                        <button type="button" class="filtro-pill" data-filtro="margen">Margen %</button>
                        <button type="button" class="filtro-pill" data-filtro="multiplicador">Multiplicador ×</button>
                    </div>
                </div>

                <!-- Grid de Productos renderizado dinámicamente por productos.js -->
                <div class="productos-grid" id="productos-grid"></div>

            </section>

        </main>
    </div>
</div>

<script src="../assets/js/models.js?v=31"></script>
<script src="../assets/js/store.js?v=31"></script>
<script src="../assets/js/theme.js?v=31"></script>
<script src="../assets/js/app-shell.js?v=31"></script>
<script src="../assets/js/asesor/asesor-parser.js?v=31"></script>
<script src="../assets/js/asesor/asesor-finanzas.js?v=31"></script>
<script src="../assets/js/asesor/asesor-ui.js?v=31"></script>
<script src="../assets/js/asesor/asesor-comandos.js?v=31"></script>
<script src="../assets/js/asesor/asesor-flujo.js?v=31"></script>
<script src="../assets/js/asesor-agente.js?v=31"></script>
<script src="../assets/js/productos.js?v=31"></script>
</body>
</html>
